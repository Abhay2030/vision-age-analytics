version: "3.9"

services:
  age-api:
    build: .
    container_name: age-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload

  age-dashboard:
    build: .
    container_name: age-dashboard
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - age-api
